spring.application.name=vaotrip-demo

# Configuraci\u00f3n de seguridad de la sesi\u00f3n HTTP

# Utiliza \u00fanicamente cookies para gestionar el seguimiento de sesiones.
# Evita incluir el identificador de sesi\u00f3n en las URL.
server.servlet.session.tracking-modes=cookie

# Impide que JavaScript acceda a la cookie de sesi\u00f3n.
# Ayuda a mitigar el robo de cookies mediante ataques XSS.
server.servlet.session.cookie.http-only=true

# Restringe el env\u00edo de la cookie en solicitudes entre sitios,
# permitiendo normalmente la navegaci\u00f3n desde enlaces externos.
# Ofrece protecci\u00f3n parcial frente a ataques CSRF.
server.servlet.session.cookie.same-site=lax

# Desactiva la cach\u00e9 de plantillas Thymeleaf durante el desarrollo.
# Permite visualizar cambios en las plantillas sin reiniciar la aplicaci\u00f3n.
spring.thymeleaf.cache=false

spring.main.banner-mode=off


# Esto le dice a Spring Boot que no cargue la configuraci\u00f3n autom\u00e1tica de JPA, evitando errores por falta de base de datos.
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
#org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Usuario para pruebas
#spring.security.user.name=usuario@mibodega.com
#spring.security.user.password={noop}123


spring.datasource.url=jdbc:postgresql://localhost:5432/prueba_usuarios_viajes
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
